services:
  - type: web
    name: vaaniai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: VaaniAI Backend
      - key: DEMO_MODE
        value: true
      - key: STT_PROVIDER
        value: cartesia
      - key: TTS_PROVIDER
        value: cartesia
      - key: CARTESIA_VERSION
        value: 2026-03-01
      - key: CARTESIA_STT_MODEL
        value: ink-whisper
      - key: CARTESIA_TTS_MODEL
        value: sonic-3.5
      - key: CARTESIA_OUTPUT_CONTAINER
        value: mp3
      - key: CARTESIA_SAMPLE_RATE
        value: 44100
      - key: CARTESIA_BIT_RATE
        value: 128000
      - key: CARTESIA_SPEED
        value: 1.0
      - key: CARTESIA_VOLUME
        value: 1.0
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_TEMPERATURE
        value: 0.35
      - key: VOICE_AGENT_POLISH_REPLIES
        value: true
      - key: SMS_PROVIDER
        value: fast2sms
      - key: FAST2SMS_ROUTE
        value: q
      - key: FAST2SMS_LANGUAGE
        value: english
      - key: CLINIC_NAME
        value: Pawani Medicals
      - key: CALENDAR_PROVIDER
        value: disabled
